name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install purr
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install test deps
        run: |
          pip install pytest

      - name: Run tests
        env:
          PURR_HOME: ${{ runner.temp }}/purr-test
        run: |
          pytest tests/ -v

  lint:
    name: lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Syntax check
        run: |
          python -m compileall -q src/purr/

      - name: Import smoke test
        run: |
          python -c "from purr.app import PurrApp; from purr.agents import AgentManager; from purr import tools; print('OK', len(tools.TOOLS), 'tools')"
