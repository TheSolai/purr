[project]
name = "purr"
version = "0.1.0"
description = "🐾 purr — funky ASCII TUI for chatting with your local Ollama models. Chat, assign work, make agents. Your Mac's friendly local AI companion."
authors = [{ name = "Amre" }]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "ollama>=0.4.0",
    "textual>=0.85.0",
    "rich>=13.9.0",
    "httpx>=0.27.0",
]

[project.scripts]
purr = "purr.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/purr"]

[tool.purr]
default_model = "llama3-groq-tool-use:8b"
ollama_host = "http://localhost:11434"
theme = "catppuccin-mocha"
